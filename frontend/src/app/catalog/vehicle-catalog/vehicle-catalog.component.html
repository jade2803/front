<style>
  body {
    margin: 0;
    padding: 0;
    filter: grayscale(50%);
    font-family: Arial, sans-serif;
  }

  .filter-container {
    padding: 1rem;
    background-color: #209076;
    color: white;
    border-radius: 10px;
    margin-bottom: 1rem;
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    justify-content: space-between;
  }

  .filter-container label {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
  }

  .filter-container select,
  .filter-container input {
    width: 100%;
    padding: 0.5rem;
    border: none;
    border-radius: 5px;
  }

  .vehicle-catalog {
    display: flex;
    flex-wrap: wrap;
    gap: 2rem;
    justify-content: center;
    padding: 2rem;
  }

  .vehicle-card {
    background: linear-gradient(145deg, #529b8a, #22836e);
    box-shadow: 8px 8px 16px rgba(0, 0, 0, 0.4), -8px -8px 16px rgba(67, 133, 116, 0.8);
    border-radius: 15px;
    overflow: hidden;
    max-width: 300px;
    width: 100%;
    transition: transform 0.2s ease, box-shadow 0.3s ease;
  }

  .vehicle-card:hover {
    transform: translateY(-5px);
    box-shadow: 12px 12px 24px rgba(0, 0, 0, 0.5), -12px -12px 24px rgba(67, 133, 116, 1);
  }

  .vehicle-image {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-bottom: 2px solid #135647;
  }

  .vehicle-info {
    padding: 1.5rem;
    color: #e6e6e6;
  }

  .vehicle-info h3 {
    color: #f5f1f1;
    margin-bottom: 0.5rem;
  }

  .vehicle-info p {
    margin: 0.5rem 0;
  }

  .vehicle-info strong {
    color: #1ce7ad;
  }

  /* Estilo para el botón "Ver más" */
.details-button {
  padding: 12px 20px;
  border-radius: 8px;
  background: linear-gradient(145deg, #609184, #578d80); /* Usando el mismo estilo de fondo */
  color: #e6e6e6;
  font-weight: bold;
  cursor: pointer;
  border: none;
  transition: background 0.3s ease;
  width: 100%;
  max-width: 200px; /* Limita el tamaño del botón */
  margin: 20px auto; /* Centra el botón horizontalmente */
  display: block; /* Asegura que el botón se comporte como un bloque */
}

.details-button:hover {
  background: linear-gradient(145deg, #73b3a1, #5b9c8b); /* Efecto hover */
}

.details-button:active {
  transform: scale(0.98); /* Efecto al presionar */
}

</style>

<body>
    <!-- Filtros -->
    <div class="filters">
      <!-- Marca -->
      <label for="brand">Marca:</label>
      <select id="brand" [(ngModel)]="filters.brand" (change)="applyFilters()">
        <option value="">Todas</option>
        <option *ngFor="let brand of brands" [value]="brand">{{ brand }}</option>
      </select>
    
      <!-- Modelo -->
      <label for="model">Modelo:</label>
      <select id="model" [(ngModel)]="filters.model" (change)="applyFilters()">
        <option value="">Todos</option>
        <option *ngFor="let model of models" [value]="model">{{ model }}</option>
      </select>
    
      <!-- Precio mínimo -->
      <label for="price">Precio mínimo:</label>
      <input
        id="price"
        type="number"
        [(ngModel)]="filters.price"
        (input)="applyFilters()"
        [min]="40"
        placeholder="Precio mínimo"
      />
    </div>

    <h1 style="text-align: center; color: #209076;">Catálogo de Vehículos</h1>
    
    <!-- Catálogo de vehículos -->
    <div class="vehicle-catalog">
      <div *ngFor="let vehicle of filteredVehicles" class="vehicle-card">
        <img
          [src]="vehicle.imageUrl"
          alt="{{ vehicle.brand }} {{ vehicle.model }}"
          class="vehicle-image"
        />
        <div class="vehicle-info">
          <h3>{{ vehicle.brand }} {{ vehicle.model }}</h3>
          <p><strong>Placa:</strong> {{ vehicle.license_plate }}</p>
          <p><strong>Precio de alquiler:</strong> ${{ vehicle.rental_rate }}</p>
          <p><strong>Estado:</strong> {{ vehicle.status }}</p>
          <button (click)="viewDetails(vehicle)" class="details-button">Ver más</button>
        </div>
      </div>
    </div>
