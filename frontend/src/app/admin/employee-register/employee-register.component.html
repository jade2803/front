<style>
  body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  margin: 0;
  padding: 0;
  background: url('https://upload.wikimedia.org/wikipedia/commons/c/c5/0_Kia_Morning_%28JA%29_FL_1.jpg') no-repeat center center fixed;
  background-size: cover;
  filter: grayscale(50%);
}
</style>

<body>
<div class="container">
<form (ngSubmit)="onRegister()">
<h2>Registrar Empleado</h2>

<!-- Nombre -->
<div>
  <label for="name">Nombre:</label>
  <input type="text" id="name" name="name" [(ngModel)]="name" required />
</div>

<!-- Correo Electrónico -->
<div>
  <label for="email">Correo Electrónico:</label>
  <input type="email" id="email" name="email" [(ngModel)]="email" required />
</div>

<!-- Contraseña -->
<div>
  <label for="password">Contraseña:</label>
  <input type="password" id="password" name="password" [(ngModel)]="password" required />
</div>

<!-- Rol -->
<div>
  <label for="role">Rol:</label>
  <select id="role" name="role" [(ngModel)]="role" required>
    <option value="Employee">Empleado</option>
    <option value="Admin">Administrador</option>
  </select>
</div>

<!-- Botón de registro -->
<button name="Registrar" type="submit" [disabled]="!name || !email || !password || !role">Registrar</button>
</form>
</div>
</body>
