<h2 mat-dialog-title>{{ isEditMode ? 'Editar Empleado' : 'Agregar Empleado' }}</h2>

<form [formGroup]="employeeForm" (ngSubmit)="onSubmit()">
  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Nombre</mat-label>
    <input matInput formControlName="name" required />
    <mat-error *ngIf="employeeForm.get('name')?.hasError('required')">
      El nombre es obligatorio.
    </mat-error>
    <mat-error *ngIf="employeeForm.get('name')?.hasError('pattern')">
      Solo letras y espacios.
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Email</mat-label>
    <input matInput formControlName="email" required />
    <mat-error *ngIf="employeeForm.get('email')?.hasError('required')">
      El correo es obligatorio.
    </mat-error>
    <mat-error *ngIf="employeeForm.get('email')?.hasError('email')">
      Correo inválido.
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Rol</mat-label>
    <mat-select formControlName="role" required>
      <mat-option value="Administrator">Administrator</mat-option>
      <mat-option value="Employee">Employee</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Contraseña</mat-label>
    <input matInput type="password" formControlName="password" />
  </mat-form-field>

  <div mat-dialog-actions align="end">
    <button mat-button type="button" (click)="onCancel()">Cancelar</button>
    <button mat-button color="primary" type="submit" [disabled]="employeeForm.invalid">Guardar</button>
  </div>
</form>
