<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Usuario</title>
  <style>
    /* Estilo existente */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 0;
      background: url('https://upload.wikimedia.org/wikipedia/commons/c/c5/0_Kia_Morning_%28JA%29_FL_1.jpg') no-repeat center center fixed;
      background-size: cover;
      filter: grayscale(50%);
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5); /* Ajusta la opacidad para mejorar el contraste */
      z-index: 0;
    }

    .container {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    form {
      background: linear-gradient(145deg, #2b6d5e, #135647);
      box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.6), -10px -10px 20px rgba(67, 133, 116, 0.8);
      border-radius: 15px;
      padding: 2rem;
      max-width: 400px;
      width: 100%;
    }

    h2 {
      text-align: center;
      color: #e6e6e6;
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      color: #b8b8b8;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 0.5rem;
      border: 1px solid #438574;
      border-radius: 8px;
      background-color: #2b6d5e;
      color: #e6e6e6;
      outline: none;
      transition: all 0.3s ease;
    }

    input:focus {
      border-color: #5b9c8b;
      box-shadow: 0 0 10px rgba(115, 179, 161, 0.5);
    }

    button {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(145deg, #5b9c8b, #438574);
      color: #e6e6e6;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    button:hover {
      background: linear-gradient(145deg, #73b3a1, #5b9c8b);
    }

    button:disabled {
      background: #2b6d5e;
      cursor: not-allowed;
    }

    button:active {
      transform: scale(0.98);
    }

    .error {
      color: #ff4d4d;
      font-size: 0.9rem;
      margin-top: -0.5rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="alert" *ngIf="alertMessage" [ngClass]="alertType">
    {{ alertMessage }}
  </div>
  
  <div class="container">
    <form (ngSubmit)="onRegister()" novalidate>
      <h2>Registrar Usuario</h2>

      <div>
        <label for="name">Nombre:</label>
        <input
          type="text"
          id="name"
          name="name"
          [(ngModel)]="name"
          required
        />
        <div *ngIf="name && !isNameValid" class="error">
          Ingresa un nombre válido (solo letras y espacios).
        </div>
      </div>

      <div>
        <label for="email">Correo Electrónico:</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
        />
        <div *ngIf="email && !isEmailValid" class="error">
          Ingresa un correo electrónico válido.
        </div>
      </div>

      <div>
        <label for="password">Contraseña:</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
        />
      </div>

      <button
        name="Registrar"
        type="submit"
        [disabled]="!name || !email || !password || !isNameValid || !isEmailValid"
      >
        Registrar
      </button>
    </form>
  </div>
</body>
</html>
