<div *ngIf="isLoading" class="loading">
  <p>Cargando datos...</p>
</div>

<div *ngIf="!isLoading" class="table-container">
  <h2>DEVOLUCIONES</h2>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
    <ng-container matColumnDef="customerName">
      <th mat-header-cell *matHeaderCellDef> Cliente </th>
      <td mat-cell *matCellDef="let return"> {{ return.customer.name }} </td>
    </ng-container>

    <ng-container matColumnDef="vehicleDetails">
      <th mat-header-cell *matHeaderCellDef> Vehículo </th>
      <td mat-cell *matCellDef="let return">
        {{ return.vehicle.brand }} {{ return.vehicle.model }} ({{ return.vehicle.license_plate }})
      </td>
    </ng-container>

    <ng-container matColumnDef="returnDate">
      <th mat-header-cell *matHeaderCellDef> Fecha Devolución </th>
      <td mat-cell *matCellDef="let return"> {{ return.end_date | date: 'short' }} </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef> Estado </th>
      <td mat-cell *matCellDef="let return"> {{ return.status }} </td>
    </ng-container>

    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef> Acción </th>
      <td mat-cell *matCellDef="let return">
        <button mat-button (click)="openReturnModal(return)">Devolución</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
